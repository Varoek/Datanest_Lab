# DataNest Home Lab - Samba Share Configuration
# Append to /etc/samba/smb.conf on VM 101 (Ubuntu Docker Host)

[DataNest-SSD]
   comment = DataNest External SSD Primary Storage
   path = /mnt/wd-ssd
   browseable = yes
   read only = no
   guest ok = no
   valid users = docker
   force user = docker
   create mask = 0775
   directory mask = 0775
